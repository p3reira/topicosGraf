<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js">
        
    </script>
    
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-sphere position="2 9 -7" radius="1" color="yellow" >
    <a-light type="directional" color="yellow" intensity="1" position="1 0 0"></a-light>
    </a-sphere>
     
    <a-sky color="#ADD8E6"></a-sky>
    <a-plane rotation="-90 0 0" width="60" height="60" color="#7CFC00"></a-plane>
    <a-light type="ambient" color="#9a92b5" intensity="0.9"></a-light>
    <a-light type="directional" color="red" intensity="0.85" position="0 1 7"></a-light>
    <a-light type="directional" color="yellow" intensity="0.85" position="-6 2 7"></a-light>
    <a-light type="directional" color="blue" intensity="0.85" position="-6 9 1"></a-light>

    <a-box position="-2.5 1.5 -1" color="#ff5d8f" class="clickable" animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
        <a-text value="Cubo" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-box>
    <a-sphere position="-1.5 1.5 -1" radius="0.45" color="#ffb454" class="clickable" animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
        <a-text value="Esfera" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-sphere>
    <a-cylinder position="-0.5 1.5 -1" radius="0.7" height="0.9" color="#4fd1c5" class="clickable" animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
        <a-text value="Cone" Cilindro="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-cylinder>
    <a-cone position="0.5 1.5 -1" radius-bottom="0.5" radius-top="0" height="0.9" color="#63b3ed" class="clickable" animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
        <a-text value="Cone" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-cone>
    <a-torus position="1.5 1.5 -1" radius="0.4" radius-tubular="0.12" color="#b794f4" class="clickable" animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
        <a-text value="Rosquinha" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-torus>
    <a-dodecahedron position="2.5 1.5 -1" radius="0.48" color="#f687b3" class="clickable" animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
        <a-text value="Dodecaedro" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-dodecahedron>

    
    </a-scene>

   <a-camera>
  <a-entity id="painel-msg" visible="false" position="0 -0.55 -1"
            geometry="primitive: plane; width: 0.95; height: 0.18"
            material="color: #0e0b16; opacity: 0.88; shader: flat">
    <a-text id="texto-msg" value="" align="center" width="1.6" color="#ffffff" position="0 0 0.01"></a-text>
  </a-entity>
</a-camera>

<script>
  AFRAME.registerComponent('interativo', {
    init: function () {
      var el = this.el;
      var nome = el.getAttribute('data-nome') || 'objeto';
      el.addEventListener('click', function () {
        // sorteia uma cor e aplica no material
        var cor = '#' + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0');
        el.setAttribute('material', 'color', cor);
        // escreve e mostra a mensagem
        document.querySelector('#texto-msg').setAttribute('value', 'Você tocou em: ' + nome);
        document.querySelector('#painel-msg').setAttribute('visible', true);
      });
    }
  });
</script>
  </body>
</html>
