<!DOCTYPE html>
<html>
<head>
  <script>AFRAME.registerComponent('tocar-animacao', {
  init: function () {
    this.el.addEventListener('model-loaded', (e) => {
      const model = e.detail.model;
      if (model.animations && model.animations.length) {
        this.mixer = new THREE.AnimationMixer(model);
        this.mixer.clipAction(model.animations[0]).play();
      }
    });
  },
  tick: function (t, dt) { if (this.mixer) this.mixer.update(dt / 1000); }
});
  </script>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false">
    <a-marker preset="hiro">
      <a-entity position="0 0.5 0">
  <a-sphere radius="0.4" color="#4fd1c5"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"></a-sphere>

  <!-- o pivo gira e leva a lua junto -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
    <a-sphere radius="0.1" color="#ffb454" position="0.8 0 0"></a-sphere>
    <a-text value="Planeta" align="center" position="0 0.9 0" color="#ffffff" width="4"></a-text>
  </a-entity>
        <a-entity gltf-model="astronauta.glb"
          position="-0.7 0 0" scale="0.35 0.35 0.35"></a-entity>

<a-entity gltf-model="robo.glb" tocar-animacao
          position="0.7 0 0" scale="0.35 0.35 0.35"></a-entity>
</a-entity>
    </a-marker>
    <a-entity camera></a-entity>
    
  </a-scene>
</body>
</html>
