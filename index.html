<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false">
    <a-marker preset="hiro">
      <a-entity position="0 0.5 0">
  <a-sphere radius="0.4" color="#4fd1c5"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"></a-sphere>

  <!-- o pivo gira e leva a lua junto -->
  <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
    <a-sphere radius="0.1" color="#ffb454" position="0.8 0 0"></a-sphere>
  </a-entity>
</a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
