<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin:0;">
  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    color-space="sRGB" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="ambient" intensity="1"></a-light>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-sphere radius="0.3" color="#4fd1c5" position="0 0 0.25"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-sphere>
      <a-text value="Detectado!" align="center" position="0 0.6 0" color="#ffffff" width="2"></a-text>
    </a-entity>

  </a-scene>
</body>
</html>
